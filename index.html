<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> VoltForge </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"> 

<link rel="stylesheet" href="style.css">
  
</head>
<body>

<div class="container">

  <div class="hero">
    <h1>VoltForge</h1>
    <p>Interactive Electronics Engineering Toolkit Built with HTML, CSS & JavaScript</p>
  </div>

  <div class="grid">

    <div class="card">
      <h2>Ohm's Law Calculator</h2>

      <div class="input-group">
        <label>Voltage (V)</label>
        <input type="number" id="voltage" placeholder="Leave one field empty">
      </div>

      <div class="input-group">
        <label>Current (I)</label>
        <input type="number" id="current" placeholder="Leave one field empty">
      </div>

      <div class="input-group">
        <label>Resistance (R)</label>
        <input type="number" id="resistance" placeholder="Leave one field empty">
      </div>

      <button onclick="calculateOhmsLaw()">Calculate</button>

      <div class="result" id="ohmResult">
        Your result will appear here.
      </div>
    </div>

    <div class="card">
      <h2>Power Calculator</h2>

      <div class="input-group">
        <label>Voltage (V)</label>
        <input type="number" id="powerVoltage" placeholder="Enter voltage">
      </div>

      <div class="input-group">
        <label>Current (I)</label>
        <input type="number" id="powerCurrent" placeholder="Enter current">
      </div>

      <button onclick="calculatePower()">Calculate Power</button>

      <div class="result" id="powerResult">
        Power output will appear here.
      </div>
    </div>

    <div class="card">
      <h2>Resistor Color Code</h2>

      <div class="resistor">
        <div class="wire"></div>

        <div class="resistor-body">
          <div class="band" id="band1Visual"></div>
          <div class="band" id="band2Visual"></div>
          <div class="band" id="band3Visual"></div>
          <div class="band" id="band4Visual"></div>
        </div>

        <div class="wire"></div>
      </div>

      <div class="input-group">
        <label>Band 1</label>
        <select id="band1"></select>
      </div>

      <div class="input-group">
        <label>Band 2</label>
        <select id="band2"></select>
      </div>

      <div class="input-group">
        <label>Multiplier</label>
        <select id="band3"></select>
      </div>

      <div class="input-group">
        <label>Tolerance</label>
        <select id="band4"></select>
      </div>

      <button onclick="calculateResistor()">Decode Resistor</button>

      <div class="result" id="resistorResult">
        Resistance value will appear here.
      </div>
    </div>

  </div>

  <footer>
    Built by Nakul Sarath
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
